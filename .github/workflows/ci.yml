name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clubs
          POSTGRES_PASSWORD: clubs
          POSTGRES_DB: clubs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clubs" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_CLIENT: pg
      DATABASE_URL: postgres://clubs:clubs@localhost:5432/clubs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Spec 15.1 rule 3: db and integration suites run on PostgreSQL as well.
      - run: npx vitest run tests/db tests/integration
        working-directory: apps/api

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-test-sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_CHANNEL: chromium
